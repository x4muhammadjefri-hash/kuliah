
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencari Profil GitHub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 10px;

            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {

            padding: 10px 20px;
            background-color: #2ea44f;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2c974b;
        }

        .message {
            text-align: center;
            color: #666;
            font-style: italic;
        }

        /* Profile Card Styles */
        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;

            border-top: 1px solid #eee;
            padding-top: 20px;
            margin-top: 20px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #2ea44f;
            margin-bottom: 15px;
        }

        .profile-name {
            font-size: 22px;
            font-weight: bold;
            color: #24292e;
            margin: 5px 0;
        }

        .profile-username {
            color: #586069;
            font-size: 14px;

            margin-bottom: 10px;
        }

        .profile-bio {
            text-align: center;
            color: #333;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .profile-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #586069;
        }

        .profile-btn {
            display: inline-block;
            padding: 8px 16px;
            background-color: #0366d6;
            color: white;
            text-decoration: none;

            border-radius: 5px;
            font-size: 14px;
        }

        .profile-btn:hover {
            background-color: #005cc5;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>APK Pencarian Profil GitHub </h2>
        
        <!-- Form Input -->
        <div class="search-box">
            <input type="text" id="usernameInput" placeholder="Masukkan username GitHub...">
            <button id="searchBtn">Cari</button>
        </div>


        <!-- Area Informasi/Status (Loading / Error) -->
        <div id="infoMessage" class="message hidden"></div>

        <!-- Kartu Hasil Profil -->
        <div id="profileResult" class="profile-card hidden">
            <img id="avatar" class="profile-avatar" src="" alt="Avatar">
            <div id="name" class="profile-name"></div>
            <div id="username" class="profile-username"></div>
            <div id="bio" class="profile-bio"></div>
            <div class="profile-stats">
                <div>Repositori Publik: <strong id="reposCount"></strong></div>
            </div>
            <a id="profileLink" class="profile-btn" href="" target="_blank">Lihat Profil di GitHub</a>
        </div>
    </div>


    <script>
        const searchBtn = document.getElementById('searchBtn');
        const usernameInput = document.getElementById('usernameInput');
        const infoMessage = document.getElementById('infoMessage');
        const profileResult = document.getElementById('profileResult');

        const avatar = document.getElementById('avatar');
        const nameEl = document.getElementById('name');
        const usernameEl = document.getElementById('username');
        const bioEl = document.getElementById('bio');
        const reposCount = document.getElementById('reposCount');
        const profileLink = document.getElementById('profileLink');

        searchBtn.addEventListener('click', fungsiCariProfil);
        usernameInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                fungsiCariProfil();
            }
        });

        async function fungsiCariProfil() {
            const username = usernameInput.value.trim();

            if (!username) {
                alert('Silakan masukkan username terlebih dahulu!');
                return;
            }

            // 1. Kondisi: Loading saat request berjalan
            infoMessage.textContent = 'Memuat data...';
            infoMessage.classList.remove('hidden');

            profileResult.classList.add('hidden');

            try {
                const response = await fetch(`https://api.github.com/users/${username}`);

                // 2. Kondisi: User tidak ditemukan (Status 404)
                if (response.status === 404) {
                    infoMessage.textContent = 'User tidak ditemukan (Status 404).';
                    return;
                }

                if (!response.ok) {
                    throw new Error('Terjadi kesalahan pada jaringan.');
                }

                const data = await response.json();

                // 3. Kondisi: Data berhasil ditampilkan
                infoMessage.classList.add('hidden');
                

                avatar.src = data.avatar_url;
                nameEl.textContent = data.name ? data.name : 'Nama tidak tersedia';
                usernameEl.textContent = `@${data.login}`;
                bioEl.textContent = data.bio ? data.bio : 'Bio tidak tersedia';
                reposCount.textContent = data.public_repos;
                profileLink.href = data.html_url;

                profileResult.classList.remove('hidden');

            } catch (error) {
                infoMessage.textContent = 'Gagal mengambil data. Periksa koneksi internet Anda.';
                console.error(error);
            }
        }
    </script>
</body>
</html>
